services:
  - type: web
    name: skyace-server
    runtime: node
    buildCommand: "echo no build"
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: TRUST_PROXY
        value: "1"
      - key: ADMIN_KEY
        generateValue: true
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: ALLOWED_EXTENSION_ID
        sync: false
